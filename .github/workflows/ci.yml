name: "CI"

on:
  # Any pull request activity (open, synchronize, reopen)
  pull_request:
  # When called from another workflow
  workflow_call:

jobs:
  lint:
    name: "Lint"
    runs-on: "ubuntu-24.04"
    steps:
      - uses: "actions/checkout@v6"

      # rustfmt.toml uses nightly-only options; everything else builds on stable because nightly breaks the
      # `rustix` 0.37 build script on Linux.
      - uses: "dtolnay/rust-toolchain@nightly"
        with:
          components: "rustfmt"

      - uses: "dtolnay/rust-toolchain@stable"
        with:
          components: "clippy"

      - uses: "Swatinem/rust-cache@v2"
        with:
          shared-key: "lint"

      - name: "Rustfmt"
        run: "cargo +nightly fmt --all -- --check"

      - name: "Clippy"
        run: "cargo +stable clippy --all-targets -- -D warnings"

      - name: "Unit tests and doc-tests"
        run: "cargo +stable test --locked"
