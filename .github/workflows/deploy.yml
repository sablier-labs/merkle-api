name: "Deploy on Vercel"

# Allow only one concurrent deployment, canceling runs queued between the run in-progress and latest queued
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

on:
  # Can be manually triggered by any member with Write permission
  workflow_dispatch:

jobs:
  ci:
    name: "Run CI checks"
    uses: "./.github/workflows/ci.yml"

  deploy:
    environment: "Production"
    needs: "ci"
    runs-on: "ubuntu-24.04"
    steps:
      - name: "Check out the repo"
        uses: "actions/checkout@v6"

      # vercel-rust@4 cross-compiles via `cargo zigbuild --target x86_64-unknown-linux-gnu`
      # whenever it runs outside Vercel's build image, so we need zig + cargo-zigbuild.
      - name: "Install Rust"
        uses: "dtolnay/rust-toolchain@stable"

      - name: "Install Zig"
        uses: "mlugg/setup-zig@v2"

      - name: "Install cargo-zigbuild"
        uses: "taiki-e/install-action@v2"
        with:
          tool: "cargo-zigbuild"

      - name: "Cache Rust build artifacts"
        uses: "Swatinem/rust-cache@v2"
        with:
          shared-key: "deploy"

      - name: "Set up Node.js"
        uses: "actions/setup-node@v4"
        with:
          node-version: "20"

      - name: "Install Vercel CLI"
        run: "npm install --global vercel@latest"

      - name: "Vercel: pull environment"
        run: "vercel pull --environment=production --yes"

      - name: "Vercel: build project artifacts"
        run: "vercel build --prod"

      - name: "Deploy to Vercel without promotion"
        id: "deploy"
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prod --prebuilt --skip-domain)"
          if [[ ! "$deployment_url" =~ ^https://[^[:space:]]+$ ]]; then
            echo "Vercel returned no valid deployment URL." >&2
            exit 1
          fi
          printf 'deployment_url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"

      - name: "Verify deployment endpoints"
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          probe() {
            local endpoint="$1" expected_status="$2" json_check="$3"
            local actual_status
            actual_status="$(vercel curl "$endpoint" --deployment "$DEPLOYMENT_URL" --scope=sablier -- \
              --silent --show-error --max-time 30 --connect-timeout 10 \
              --output "$response_file" --write-out '%{http_code}')"
            if [[ "$actual_status" != "$expected_status" ]] || ! jq -e -s "$json_check" "$response_file" > /dev/null; then
              printf 'Deployment probe failed for %s (HTTP %s).\n' "$endpoint" "$actual_status" >&2
              return 1
            fi
          }

          probe /api/health 200 'length == 1 and .[0].status == "success"'
          for endpoint in /api/create /api/validity /api/eligibility; do
            probe "$endpoint" 401 'length == 1 and .[0].message == "Bad authentication process provided."'
          done

      - name: "Promote verified deployment"
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: 'vercel promote "$DEPLOYMENT_URL" --scope=sablier --yes'
